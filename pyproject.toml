[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyvllm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "safetensors>=0.5,<0.6",
    "torch>=2.9,<2.10",
    "transformers>=4.51,<4.52",
]

[tool.setuptools.packages.find]
include = ["tinyvllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
