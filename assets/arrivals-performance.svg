<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">tiny-vLLM versus nano-vLLM: 16 staggered requests</title>
<desc id="desc">64 and 512 input tokens alternating, 64 output tokens each, requests arrive every 20 milliseconds. TTFT and TPOT are median replay p50 latencies. Percentages compare tiny-vLLM with nano-vLLM in this workload.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0fdfa"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
</defs>
<rect width="1200" height="270" rx="20" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="32" font-size="18" font-weight="700" fill="#0f172a">16 staggered requests</text>
<text x="24" y="55" font-size="13" fill="#475569">64 / 512 input tokens · 64 output tokens · 20 ms arrival interval</text>

<rect x="24" y="76" width="372" height="174" rx="14" fill="#ffffff" stroke="#dbe7e8"/>
<text x="42" y="105" font-size="17" font-weight="700" fill="#0f172a">TTFT</text>
<rect x="270" y="89" width="108" height="26" rx="13" fill="#ccfbf1"/>
<text x="283" y="107" font-size="13" font-weight="700" fill="#0f766e">37.8% lower</text>
<text x="42" y="128" font-size="12" font-weight="400" fill="#64748b">Time to first token</text>
<line x1="42" y1="141" x2="378" y2="141" stroke="#e2e8f0"/>
<circle cx="47" cy="164" r="4" fill="#0891a0"/>
<text x="59" y="169" font-size="13" font-weight="700" fill="#0f172a">tiny-vLLM</text>
<text x="378" y="170" text-anchor="end" font-size="23" font-weight="700" fill="#087e8b">22.76<tspan dx="4" font-size="12" font-weight="400" fill="#475569">ms</tspan></text>
<circle cx="47" cy="200" r="4" fill="#94a3b8"/>
<text x="59" y="205" font-size="13" font-weight="400" fill="#475569">nano-vLLM</text>
<text x="378" y="206" text-anchor="end" font-size="19" fill="#64748b">36.60<tspan dx="4" font-size="12">ms</tspan></text>
<text x="42" y="232" font-size="11" font-weight="400" fill="#64748b">Lower is better</text>
<rect x="414" y="76" width="372" height="174" rx="14" fill="#ffffff" stroke="#dbe7e8"/>
<text x="432" y="105" font-size="17" font-weight="700" fill="#0f172a">TPOT</text>
<rect x="660" y="89" width="108" height="26" rx="13" fill="#ccfbf1"/>
<text x="673" y="107" font-size="13" font-weight="700" fill="#0f766e">9.2% lower</text>
<text x="432" y="128" font-size="12" font-weight="400" fill="#64748b">Time per output token</text>
<line x1="432" y1="141" x2="768" y2="141" stroke="#e2e8f0"/>
<circle cx="437" cy="164" r="4" fill="#0891a0"/>
<text x="449" y="169" font-size="13" font-weight="700" fill="#0f172a">tiny-vLLM</text>
<text x="768" y="170" text-anchor="end" font-size="23" font-weight="700" fill="#087e8b">8.34<tspan dx="4" font-size="12" font-weight="400" fill="#475569">ms/token</tspan></text>
<circle cx="437" cy="200" r="4" fill="#94a3b8"/>
<text x="449" y="205" font-size="13" font-weight="400" fill="#475569">nano-vLLM</text>
<text x="768" y="206" text-anchor="end" font-size="19" fill="#64748b">9.19<tspan dx="4" font-size="12">ms/token</tspan></text>
<text x="432" y="232" font-size="11" font-weight="400" fill="#64748b">Lower is better</text>
<rect x="804" y="76" width="372" height="174" rx="14" fill="#ffffff" stroke="#dbe7e8"/>
<text x="822" y="105" font-size="17" font-weight="700" fill="#0f172a">Throughput</text>
<rect x="1050" y="89" width="108" height="26" rx="13" fill="#ccfbf1"/>
<text x="1063" y="107" font-size="13" font-weight="700" fill="#0f766e">3.9% higher</text>
<text x="822" y="128" font-size="12" font-weight="400" fill="#64748b">Output tokens per second</text>
<line x1="822" y1="141" x2="1158" y2="141" stroke="#e2e8f0"/>
<circle cx="827" cy="164" r="4" fill="#0891a0"/>
<text x="839" y="169" font-size="13" font-weight="700" fill="#0f172a">tiny-vLLM</text>
<text x="1158" y="170" text-anchor="end" font-size="23" font-weight="700" fill="#087e8b">1,369.4<tspan dx="4" font-size="12" font-weight="400" fill="#475569">tokens/s</tspan></text>
<circle cx="827" cy="200" r="4" fill="#94a3b8"/>
<text x="839" y="205" font-size="13" font-weight="400" fill="#475569">nano-vLLM</text>
<text x="1158" y="206" text-anchor="end" font-size="19" fill="#64748b">1,317.5<tspan dx="4" font-size="12">tokens/s</tspan></text>
<text x="822" y="232" font-size="11" font-weight="400" fill="#64748b">Higher is better</text>
</g></svg>