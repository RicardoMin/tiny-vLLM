<g transform="translate(28 26)" fill="none" stroke="#8454cf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="12" height="12" rx="3"/><path d="M8 1v4m6-4v4M8 17v4m6-4v4M1 8h4m-4 6h4m12-6h4m-4 6h4"/></g>
<text x="68" y="42" class="label" fill="#8454cf">LIFECYCLE</text>
<text x="22" y="84" class="title">Engine</text>
<text x="22" y="112" class="body">Submit · commit · cancel · finish</text>
<text x="22" y="137" class="body">One execution owner per engine</text>
</g>
<g transform="translate(900 421)">
<rect width="332" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#159388"/>
<rect x="22" y="20" width="34" height="34" rx="10" fill="#e8f8f3"/>
<g transform="translate(28 26)" fill="none" stroke="#159388" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="10" height="5" rx="1"/><rect x="2" y="12" width="11" height="5" rx="1"/><rect x="16" y="12" width="4" height="5" rx="1"/></g>
<text x="68" y="42" class="label" fill="#159388">BATCHING</text>
<text x="22" y="84" class="title">Scheduler</text>
<text x="22" y="112" class="body">Chunked prefill + continuous decode</text>
<text x="22" y="137" class="body">One mixed batch, including batch = 1</text>
</g>
<g transform="translate(460 421)">
<rect width="328" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#c97828"/>
<rect x="22" y="20" width="34" height="34" rx="10" fill="#fff2e3"/>
<g transform="translate(28 26)" fill="none" stroke="#c97828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 1-8 11h7l-1 9 8-12h-7Z"/></g>
<text x="68" y="42" class="label" fill="#c97828">GPU EXECUTION</text>
<text x="22" y="84" class="title">Executor → Qwen3</text>
<text x="22" y="112" class="body">Runner · attention · CUDA kernels</text>
<text x="22" y="137" class="body">Batched sampling</text>
</g>
<g transform="translate(48 421)">
<rect width="300" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#b6568c"/>
<rect x="22" y="20" width="34" height="34" rx="10" fill="#fcedf5"/>
<g transform="translate(28 26)" fill="none" stroke="#b6568c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H3a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M6 7h10M6 11h6"/></g>
<text x="68" y="42" class="label" fill="#b6568c">RESPONSE</text>
<text x="22" y="84" class="title">Text and token output</text>
<text x="22" y="112" class="body">Incremental text decoding</text>
<text x="22" y="137" class="body">Python results · terminal · SSE</text>
</g>
<path class="edge" d="M348 262H450"/>
<text x="399" y="249" class="caption" text-anchor="middle">prompts</text>
<path class="edge" d="M788 240H890"/>
<text x="844" y="226" class="caption" text-anchor="middle">sync direct</text>
<path class="edge" d="M788 296H890"/>
<text x="844" y="281" class="caption" text-anchor="middle">AsyncEngine</text>
