<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">tiny-vllm architecture</title>
  <desc id="description">Python, CLI and HTTP requests pass through text APIs into a single-owner engine, then the scheduler and executor. Synchronous LLM calls the engine directly; asynchronous requests use AsyncEngine. Prefix caching and paged KV support scheduling; CUDA graphs replay eligible decode batches. The engine commits results and emits events for text and streaming output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#f4fbfc"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" x2="1">
      <stop stop-color="#3558d4"/><stop offset="1" stop-color="#7a4ddd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24375d" flood-opacity="0.055"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#8190ad"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.7px; }
      .title { font-size: 22px; font-weight: 700; fill: #172743; }
      .body { font-size: 16px; fill: #536581; }
      .edge { fill: none; stroke: #8190ad; stroke-width: 2; marker-end: url(#arrow); }
      .caption { font-size: 12px; font-weight: 600; fill: #657693; }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="758" rx="26" fill="url(#background)" stroke="#e2e9f2"/>
  <rect x="48" y="43" width="5" height="58" rx="2.5" fill="url(#headline)"/>
  <text x="70" y="65" font-size="14" font-weight="750" letter-spacing="2.5" fill="#5270b0">TINY-VLLM</text>
  <text x="70" y="101" font-size="30" font-weight="750" fill="#142440">One engine. Every request.</text>
  <rect x="1022" y="53" width="210" height="37" rx="18.5" fill="#e9edff" stroke="#dce3fc"/>
  <circle cx="1042" cy="71.5" r="4" fill="#6576d5"/>
  <text x="1057" y="77" font-size="13" font-weight="700" fill="#4b5aa7">SINGLE GPU · QWEN3</text>
  <text x="70" y="133" font-size="16" fill="#6a7c98">Continuous batching · Paged attention · Prefix reuse · CUDA graph replay</text>

<g transform="translate(48 181)">
<rect width="300" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#52698f"/>
<rect x="22" y="20" width="34" height="34" rx="10" fill="#eef2f8"/>
<g transform="translate(28 26)" fill="none" stroke="#52698f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="2" width="20" height="17" rx="3"/><path d="m5 7 3 3-3 3m6 0h5"/></g>
<text x="68" y="42" class="label" fill="#52698f">REQUESTS</text>
<text x="22" y="84" class="title">Python · CLI · HTTP</text>
<text x="22" y="112" class="body">Local generation and chat</text>
<text x="22" y="137" class="body">Concurrent HTTP / SSE requests</text>
</g>
<g transform="translate(460 181)">
<rect width="328" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#4265d6"/>
<rect x="22" y="20" width="34" height="34" rx="10" fill="#eef1ff"/>
<g transform="translate(28 26)" fill="none" stroke="#4265d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h16M11 3v16M7 19h8M4 7V3m14 4V3"/></g>
<text x="68" y="42" class="label" fill="#4265d6">TEXT LAYER</text>
<text x="22" y="84" class="title">LLM / AsyncLLM</text>
<text x="22" y="112" class="body">Tokenization and chat templates</text>
<text x="22" y="137" class="body">Sync calls or async request streams</text>
</g>
<g transform="translate(900 181)">
<rect width="332" height="164" rx="17" fill="#fff" stroke="#dfe6f0" filter="url(#shadow)"/>
<rect x="0" y="17" width="4" height="130" rx="2" fill="#8454cf"/>
