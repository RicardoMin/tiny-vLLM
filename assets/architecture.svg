<text x="1080" y="383" class="caption">plan / commit</text>
<path class="edge" d="M900 500H798"/>
<text x="844" y="485" class="caption" text-anchor="middle">batch</text>
<path class="edge" d="M460 500H358"/>
<text x="404" y="477" class="caption" text-anchor="middle">Engine commits</text>
<text x="404" y="491" class="caption" text-anchor="middle">and emits events</text>
<path class="edge" d="M624 636V595"/>
<path class="edge" d="M1066 636V595"/>
<rect x="460" y="638" width="328" height="79" rx="14" fill="#fff3e7" stroke="#f1dcc5"/>
<text x="482" y="668" font-size="17" font-weight="700" fill="#ad6826">Decode CUDA graphs</text>
<text x="482" y="693" font-size="14" fill="#8b745d">Padded buckets · eager fallback</text>
<rect x="900" y="638" width="332" height="79" rx="14" fill="#e9f7f2" stroke="#cbe8db"/>
<text x="922" y="668" font-size="17" font-weight="700" fill="#187e65">Prefix cache + paged KV</text>
<text x="922" y="693" font-size="14" fill="#537d6d">Shared blocks · refcounts · LRU eviction</text>
<text x="70" y="670" font-size="13" font-weight="700" fill="#8390a6" letter-spacing="1.5">ONE CORE, TWO ENTRY PATHS</text>
<text x="70" y="697" font-size="14" fill="#72829b">Direct sync calls or an async GPU bridge.</text>
</svg>